name: Other platform builds

on:
  workflow_call:

jobs:
  build-web:
    name: Build (Web)${{ matrix.label }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ""
            platform: web
            artifact: butterscotch-web
            output_glob: build/butterscotch.*
          - label: " [Meta]"
            platform: web-meta
            artifact: butterscotch-web-meta
            output_glob: build/butterscotch-meta.*
    steps:
      - uses: actions/checkout@v7

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-web-${{ matrix.platform }}-${{ github.sha }}
          restore-keys: |
            ccache-web-${{ matrix.platform }}-

      - name: Configure
        run: emcmake cmake -B build -G Ninja -DWERROR=ON -DPLATFORM=${{ matrix.platform }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output_glob }}

  build-android:
    name: Build (Android)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          cache-dependency-path: src/android/frontend/gradle/wrapper/gradle-wrapper.properties

      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y ccache

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ github.sha }}
          restore-keys: |
            ccache-android-

      - name: Build APK
        run: |
          cd src/android/frontend
          ./gradlew assembleDebug  \
            -Pandroid.cxx.ndk.ccache=true \
            -Porg.gradle.caching=true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: butterscotch-android
          path: src/android/frontend/app/build/outputs/apk/debug/app-debug.apk

  build-fixed-reals:
    name: Build with fixed reals
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ccache libglfw3-dev

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-fixed-reals-${{ github.sha }}
          restore-keys: |
            ccache-fixed-reals-

      - name: Build
        run: make CC='ccache g++ -std=gnu++11 -Wall -Wvla -Werror' CFLAGS='-DUSE_FIXED_REALS' NO_COLOR=1 VERBOSE=1
