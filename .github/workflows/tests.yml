name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  butterscotch-linux-x86_64:
    name: Butterscotch Tests (GLFW/Linux x86_64)
    runs-on: ubuntu-latest
    env:
      DOWNLOAD_COMMERCIAL_GAMES: ${{ secrets.COMMERCIAL_GAMES_URL != '' }}
      CCACHE_IGNOREOPTIONS: "-DBUTTERSCOTCH_COMMIT_HASH=* -DBUTTERSCOTCH_COMMIT_DATE=*"
    steps:
      - uses: actions/checkout@v7

      - name: Get commit info
        id: commit-info
        run: |
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=short)" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ccache libglfw3-dev libbz2-dev

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-tests-linux-x86_64

      - name: Configure
        run: cmake -B build -G Ninja -DBACKEND=glfw3 -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache "-DBUTTERSCOTCH_COMMIT_HASH=${{ steps.commit-info.outputs.hash }}" "-DBUTTERSCOTCH_COMMIT_DATE=${{ steps.commit-info.outputs.date }}"

      - name: Build Butterscotch
        run: cmake --build build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Verify path regression bundle passes
        run: |
          set -euo pipefail
          xvfb-run -a ./build/butterscotch --disable-log-colours tests/path-test/game.ios > /tmp/path-test-output.txt 2>&1

          grep -F "Game: Passed 267 tests out of 267" /tmp/path-test-output.txt

          if grep -E "Assert(Almost|Equals)? FAIL:|Assertion FAIL:" /tmp/path-test-output.txt >/dev/null; then
            echo "Path regression test reported a failure; see output above." >&2
            exit 1
          fi

          echo "Path regression bundle passed successfully."

      - name: Download Commercial Games
        if: env.DOWNLOAD_COMMERCIAL_GAMES == 'true'
        env:
          COMMERCIAL_GAMES_URL: ${{ secrets.COMMERCIAL_GAMES_URL }}
        run: |
          games=(
            undertale-ptbr-winpack
            underfavela
            deltarune-chapter4-105-beta
          )
          for game in "${games[@]}"; do
            echo "Downloading $game..."
            curl --fail --silent --show-error --location --output "tests/$game.zip" "$COMMERCIAL_GAMES_URL/$game.zip"
            unzip -q "tests/$game.zip" -d "tests/$game"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Butterscotch test suite
        working-directory: tests/Flowey
        run: |
          xvfb-run -a ./gradlew --no-daemon run --args="--test-suite ${{ github.workspace }}/tests/tests.conf --butterscotch-path ${{ github.workspace }}/build/butterscotch --skip-commercial-games=${{ env.DOWNLOAD_COMMERCIAL_GAMES != 'true' }}"

      - name: Upload test screenshots
        if: always()          # the test step exits 1 on failure; run regardless
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: |
            tests/**/actual.*.png
          if-no-files-found: ignore
